[project]
name = "rag-retrieval-evaluation"
version = "0.1.0"
description = "RAG over a Wikipedia subset with measured retrieval and answer quality"
requires-python = ">=3.11"
dependencies = [
  "fastembed>=0.4",
  "qdrant-client>=1.9",
  "rank-bm25>=0.2.2",
  "groq>=0.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
